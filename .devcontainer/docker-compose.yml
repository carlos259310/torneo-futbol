name: devcontainer-torneo-futbol

services:
  workspace:
    build:
      context: ..
      dockerfile: .devcontainer/workspace.Dockerfile
    command: sleep infinity
    working_dir: /workspace
    user: node
    volumes:
      - ..:/workspace:cached
      - torneo-futbol-node-modules:/workspace/node_modules
      - torneo-futbol-vscode-server:/home/node/.vscode-server
    ports:
      - "4321:4321"

volumes:
  torneo-futbol-node-modules:
  torneo-futbol-vscode-server:
